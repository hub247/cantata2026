<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Worship Stage — Setlist & Cifras</title>
<style>
:root{--bg:#09090b;--panel:#111318;--panel2:#181b22;--line:#2a2e38;--text:#f4f4f5;--muted:#a1a1aa;--blue:#60a5fa;--rose:#fb7185;--amber:#fbbf24;--green:#34d399;--fs:18px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;padding-bottom:86px}.top{position:sticky;top:0;z-index:20;background:rgba(17,19,24,.97);border-bottom:1px solid var(--line);padding:max(10px,env(safe-area-inset-top)) 14px 10px;backdrop-filter:blur(12px)}.toprow{max-width:1100px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.eyebrow{color:var(--blue);font-size:11px;font-weight:900;letter-spacing:.13em}.title{font-size:clamp(18px,4vw,27px);font-weight:850;margin:2px 0}.meta{color:var(--muted);font-size:13px}.next{min-width:160px;text-align:right;color:var(--muted);font-size:11px}.next b{display:block;color:var(--text);font-size:13px;margin-top:3px}.toolbar{max-width:1100px;margin:10px auto 0;display:flex;gap:8px;overflow:auto;padding-bottom:2px}.btn{min-height:42px;border:1px solid var(--line);border-radius:11px;background:var(--panel2);color:var(--text);padding:8px 12px;font-weight:750;white-space:nowrap}.btn:hover{border-color:#525866}.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.btn.primary{background:#2563eb;border-color:#3b82f6}.btn.danger{background:#7f1d1d;border-color:#ef4444}.btn.good{background:#065f46;border-color:#10b981}.beat{display:inline-block;width:10px;height:10px;border-radius:50%;background:#52525b;margin-right:6px}.beat.on{background:var(--blue);box-shadow:0 0 0 6px #60a5fa22}.direction{background:#302207;border-bottom:1px solid #6b4b0a;color:#fde68a;padding:9px 16px;text-align:center;font-size:13px}.tabs{max-width:1100px;margin:14px auto 0;padding:0 14px;display:flex;gap:8px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:9px 13px;font-weight:800}.tab.active{color:white;background:#1d4ed8;border-color:#3b82f6}.main{max-width:1100px;margin:auto;padding:14px}.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.chords{padding:clamp(16px,4vw,30px);font:var(--fs)/1.8 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;min-height:54vh}.section{display:block;color:var(--rose);font-weight:900;margin:18px 0 4px;letter-spacing:.04em}.chord{color:var(--blue);font-weight:900}.cue{color:var(--amber);font-weight:900}.muted{color:var(--muted)}.panel{display:none;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field select,.field textarea{width:100%;background:#0d0f13;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px}.field textarea{min-height:220px;resize:vertical}.songlist{display:grid;gap:9px;margin-top:14px}.songrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#0d0f13;border:1px solid var(--line);border-radius:12px;padding:12px}.songrow strong{display:block}.songrow small{color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.status{color:var(--muted);font-size:12px;margin-top:10px;min-height:18px}.footer{position:fixed;bottom:0;left:0;right:0;z-index:25;background:rgba(17,19,24,.98);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}.footer .right{text-align:right}.counter{text-align:center;color:var(--muted);font-size:12px}.locked .dangerous{opacity:.35;pointer-events:none}.stage-only .tabs,.stage-only #libraryPanel,.stage-only #editorPanel{display:none!important}.stage-only .main{max-width:none;padding:0}.stage-only .stage{border-radius:0;border-left:0;border-right:0}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#27272a;border:1px solid #52525b;padding:10px 14px;border-radius:10px;z-index:50;display:none}.empty{color:var(--muted);padding:30px;text-align:center}@media(max-width:620px){.next{min-width:115px}.toolbar{padding-right:4px}.btn{min-height:46px}.chords{font-size:calc(var(--fs) * .9)}.songrow{grid-template-columns:1fr}.actions .btn{flex:1}.hide-sm{display:none}}
</style>
</head>
<body>
<div id="app" class="app">
<header class="top"><div class="toprow"><div><div class="eyebrow">WORSHIP STAGE • BAIXO / DIREÇÃO</div><div id="songTitle" class="title">Carregando…</div><div id="songMeta" class="meta"></div></div><div class="next">PRÓXIMA<b id="nextSong">—</b></div></div>
<div class="toolbar">
<button class="btn" id="metroBtn" type="button"><span id="beat" class="beat"></span><span id="metroLabel">Metrônomo</span></button>
<button class="btn" id="scrollBtn" type="button">▶ Auto-scroll</button>
<select id="scrollSpeed" class="btn" aria-label="Velocidade de rolagem"><option value="18">Rolagem 1×</option><option value="28" selected>Rolagem 2×</option><option value="40">Rolagem 3×</option><option value="55">Rolagem 4×</option></select>
<button class="btn dangerous" id="downBtn" type="button">− Tom</button><button class="btn dangerous" id="upBtn" type="button">+ Tom</button>
<button class="btn" id="fontDown" type="button">A−</button><button class="btn" id="fontUp" type="button">A+</button>
<button class="btn" id="wakeBtn" type="button">☀ Tela ativa</button><button class="btn" id="fullBtn" type="button">⛶ Palco</button><button class="btn" id="lockBtn" type="button">🔒 Travar</button>
</div></header>
<div class="direction"><b>DIREÇÃO:</b> <span id="directionText">—</span></div>
<nav class="tabs" aria-label="Modos"><button class="tab active" data-view="cifra">Cifra</button><button class="tab" data-view="baixo">Modo Baixo</button><button class="tab" data-view="direcao">Direção</button><button class="tab" data-view="biblioteca">Biblioteca</button><button class="tab" data-view="editor">Editor</button></nav>
<main class="main">
<section class="stage" id="stagePanel"><div id="chordDisplay" class="chords"></div></section>
<section class="panel" id="libraryPanel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2 style="margin:0">Biblioteca local</h2><p class="muted">Os dados ficam neste navegador. Exporte um backup regularmente.</p></div><div class="actions"><button class="btn" id="newBtn">+ Nova música</button><button class="btn" id="importBtn">Importar JSON</button><button class="btn" id="exportBtn">Exportar JSON</button><input id="fileInput" type="file" accept="application/json,.json" hidden></div></div><div id="songList" class="songlist"></div><div id="libraryStatus" class="status" aria-live="polite"></div></section>
<section class="panel" id="editorPanel"><h2 id="editorHeading">Nova música</h2><form id="songForm"><input id="songId" type="hidden"><div class="grid"><div class="field"><label for="titleInput">Título *</label><input id="titleInput" required></div><div class="field"><label for="artistInput">Artista</label><input id="artistInput"></div><div class="field"><label for="keyInput">Tom</label><select id="keyInput"><option>C</option><option>Db</option><option>D</option><option>Eb</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>Ab</option><option>A</option><option>Bb</option><option>B</option></select></div><div class="field"><label for="bpmInput">BPM</label><input id="bpmInput" type="number" min="30" max="240" value="72"></div><div class="field"><label for="meterInput">Compasso</label><input id="meterInput" value="4/4"></div><div class="field"><label for="styleInput">Estilo</label><input id="styleInput" placeholder="Adoração, celebração…"></div></div><div class="field" style="margin-top:12px"><label for="directionInput">Nota de direção</label><input id="directionInput" placeholder="Ex.: crescer no segundo refrão"></div><div class="grid" style="margin-top:12px"><div class="field"><label for="chartInput">Cifra completa (use [Intro], [Verso], [Refrão])</label><textarea id="chartInput" placeholder="[Intro]\nC  Am7  F  G\n\n[Verso]\nC ..."></textarea></div><div class="field"><label for="bassInput">Modo Baixo</label><textarea id="bassInput" placeholder="[Intro]\nC | Am7 | F | G"></textarea></div><div class="field"><label for="directorInput">Roteiro de direção</label><textarea id="directorInput" placeholder="[Intro]\nPAD + guitarra\n[Refrão 2]\nBANDA / CRESCE"></textarea></div></div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">Salvar música</button><button class="btn" id="cancelEdit" type="button">Cancelar</button></div><div id="formStatus" class="status" aria-live="polite"></div></form></section>
</main>
<footer class="footer"><div><button id="prevBtn" class="btn dangerous" type="button">◀ Anterior</button></div><div class="counter"><b id="counter">0 / 0</b><br>SETLIST</div><div class="right"><button id="nextBtn" class="btn primary dangerous" type="button">Próxima ▶</button></div></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const NOTES_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], NOTES_FLAT=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const seed=[{id:'demo-1',title:'Modelo de Adoração',artist:'Biblioteca inicial',key:'C',bpm:72,meter:'4/4',style:'Adoração',direction:'Baixo contido no verso; crescer no segundo refrão.',chart:'[Intro]\nC  Am7  F  G\n\n[Verso]\nC  G/B  Am7  F\n\n[Pré-Refrão]\nF  Am7  G\n\n[Refrão]\nF  Am7  G  Em7\nDm7  G  C',bass:'[Intro]\nC | Am7 | F | G\n\n[Verso]\nC | G/B | Am7 | F\n\n[Refrão]\nF | Am7 | G | Em7\nDm7 | G | C | C',director:'[Intro]\nPAD + guitarra\n\n[Verso]\nBAIXO CONTIDO\n\n[Pré-Refrão]\nCRESCE ↑\n\n[Refrão 2]\nBANDA FORTE\n\n[Final]\nCORTA EM C'}];
let songs=load('ws_songs',seed), current=Number(load('ws_current',0)), transpose=0, view='cifra', scrolling=false, scrollRAF=0, lastTime=0, metronome=null, wakeLock=null, locked=false, fontSize=Number(load('ws_font',18));
function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}}function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function toast(t){const el=$('#toast');el.textContent=t;el.style.display='block';clearTimeout(el._t);el._t=setTimeout(()=>el.style.display='none',2200)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function transposeChord(chord,n){if(!n)return chord;return chord.replace(/(^|\/)([A-G])([#b]?)/g,(m,slash,l,a)=>{const src=(l+a), useFlat=a==='b'||['F','Bb','Eb','Ab','Db','Gb'].includes(currentSong().key);let i=NOTES_SHARP.indexOf(src);if(i<0)i=NOTES_FLAT.indexOf(src);if(i<0)return m;return slash+(useFlat?NOTES_FLAT:NOTES_SHARP)[(i+n+120)%12]})}
function formatText(text){const chordRx=/(^|\s|\|)([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add)?\d*(?:\([^)]*\))?(?:\/[A-G](?:#|b)?)?)(?=\s|\||$)/g;return esc(text||'').split('\n').map(line=>{if(/^\s*\[.+\]\s*$/.test(line))return `<span class="section">${line.replace(/[\[\]]/g,'')}</span>`;let x=line.replace(chordRx,(m,p,c)=>p+`<span class="chord">${esc(transposeChord(c,transpose))}</span>`);x=x.replace(/\b(CRESCE|CORTA|BANDA|SEGURA|MODULA|PARA|PAD)\b/gi,'<span class="cue">$1</span>');return x}).join('\n')}
function currentSong(){if(!songs.length)return {title:'Biblioteca vazia',artist:'',key:'—',bpm:72,meter:'—',style:'',direction:'Cadastre ou importe uma música.',chart:'',bass:'',director:''};current=Math.max(0,Math.min(current,songs.length-1));return songs[current]}
function render(){const s=currentSong(), next=songs[current+1];$('#songTitle').textContent=s.title;$('#songMeta').textContent=`${s.artist||'Sem artista'} • Tom ${transposeChord(s.key,transpose)} • ${s.bpm} BPM • ${s.meter}${s.style?' • '+s.style:''}`;$('#nextSong').textContent=next?`${next.title} • ${next.key}`:'Fim do setlist';$('#directionText').textContent=s.direction||'Sem nota de direção';const data=view==='baixo'?s.bass:view==='direcao'?s.director:s.chart;$('#chordDisplay').innerHTML=data?formatText(data):'<div class="empty">Sem conteúdo neste modo. Abra o Editor para adicionar.</div>';$('#counter').textContent=songs.length?`${current+1} / ${songs.length}`:'0 / 0';$('#metroLabel').textContent=`${s.bpm} BPM`;document.documentElement.style.setProperty('--fs',fontSize+'px');save('ws_current',current);save('ws_font',fontSize);renderList()}
function setView(v){view=v;$$('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('#stagePanel').style.display=['cifra','baixo','direcao'].includes(v)?'block':'none';$('#libraryPanel').classList.toggle('active',v==='biblioteca');$('#editorPanel').classList.toggle('active',v==='editor');if(['cifra','baixo','direcao'].includes(v))render()}
function renderList(){const box=$('#songList');if(!songs.length){box.innerHTML='<div class="empty">Nenhuma música cadastrada.</div>';return}box.innerHTML=songs.map((s,i)=>`<div class="songrow"><div><strong>${i+1}. ${esc(s.title)}</strong><small>${esc(s.artist||'Sem artista')} • ${esc(s.key)} • ${Number(s.bpm)||72} BPM</small></div><div class="actions"><button class="btn" data-act="play" data-i="${i}">Abrir</button><button class="btn" data-act="edit" data-i="${i}">Editar</button><button class="btn" data-act="up" data-i="${i}" aria-label="Mover para cima">↑</button><button class="btn" data-act="down" data-i="${i}" aria-label="Mover para baixo">↓</button><button class="btn danger" data-act="del" data-i="${i}">Excluir</button></div></div>`).join('')}
function stopScroll(){scrolling=false;cancelAnimationFrame(scrollRAF);$('#scrollBtn').textContent='▶ Auto-scroll';$('#scrollBtn').classList.remove('primary')}
function toggleScroll(){scrolling=!scrolling;$('#scrollBtn').textContent=scrolling?'⏸ Pausar':'▶ Auto-scroll';$('#scrollBtn').classList.toggle('primary',scrolling);lastTime=performance.now();if(scrolling)scrollRAF=requestAnimationFrame(scrollStep)}
function scrollStep(t){if(!scrolling)return;const speed=Number($('#scrollSpeed').value);window.scrollBy(0,speed*(t-lastTime)/1000);lastTime=t;if(innerHeight+scrollY>=document.documentElement.scrollHeight-4)return stopScroll();scrollRAF=requestAnimationFrame(scrollStep)}
function toggleMetro(){if(metronome){clearInterval(metronome);metronome=null;$('#metroBtn').classList.remove('danger');$('#beat').classList.remove('on');return}const bpm=Math.max(30,Math.min(240,Number(currentSong().bpm)||72)),tick=()=>{$('#beat').classList.add('on');setTimeout(()=>$('#beat').classList.remove('on'),90)};tick();metronome=setInterval(tick,60000/bpm);$('#metroBtn').classList.add('danger')}
async function toggleWake(){try{if(wakeLock){await wakeLock.release();wakeLock=null;$('#wakeBtn').classList.remove('good');toast('Tela ativa desativada')}else if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');$('#wakeBtn').classList.add('good');wakeLock.addEventListener('release',()=>$('#wakeBtn').classList.remove('good'));toast('Tela será mantida ativa')}else toast('Wake Lock não disponível neste navegador')}catch{toast('Não foi possível manter a tela ativa')}}
function editSong(i=null){const s=i===null?{id:crypto.randomUUID(),title:'',artist:'',key:'C',bpm:72,meter:'4/4',style:'',direction:'',chart:'',bass:'',director:''}:songs[i];$('#editorHeading').textContent=i===null?'Nova música':'Editar música';$('#songId').value=s.id;['title','artist','key','bpm','meter','style','direction','chart','bass','director'].forEach(k=>$('#'+k+'Input').value=s[k]??'');setView('editor')}
$$('.tab').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));$('#prevBtn').onclick=()=>{if(locked)return toast('Destrave os controles');if(current>0){current--;transpose=0;stopScroll();scrollTo(0,0);render()}};$('#nextBtn').onclick=()=>{if(locked)return toast('Destrave os controles');if(current<songs.length-1){current++;transpose=0;stopScroll();scrollTo(0,0);render()}};$('#upBtn').onclick=()=>{transpose++;render()};$('#downBtn').onclick=()=>{transpose--;render()};$('#fontUp').onclick=()=>{fontSize=Math.min(32,fontSize+1);render()};$('#fontDown').onclick=()=>{fontSize=Math.max(12,fontSize-1);render()};$('#scrollBtn').onclick=toggleScroll;$('#metroBtn').onclick=toggleMetro;$('#wakeBtn').onclick=toggleWake;$('#fullBtn').onclick=async()=>{document.body.classList.toggle('stage-only');try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch{}};$('#lockBtn').onclick=()=>{locked=!locked;$('#app').classList.toggle('locked',locked);$('#lockBtn').textContent=locked?'🔐 Travado':'🔒 Travar';$('#lockBtn').classList.toggle('danger',locked)};
$('#newBtn').onclick=()=>editSong();$('#cancelEdit').onclick=()=>setView('biblioteca');$('#songForm').onsubmit=e=>{e.preventDefault();const id=$('#songId').value,obj={id};['title','artist','key','bpm','meter','style','direction','chart','bass','director'].forEach(k=>obj[k]=$('#'+k+'Input').value.trim());obj.bpm=Math.max(30,Math.min(240,Number(obj.bpm)||72));const i=songs.findIndex(x=>x.id===id);if(i>=0)songs[i]=obj;else songs.push(obj);save('ws_songs',songs);$('#formStatus').textContent='Música salva localmente.';render();setView('biblioteca')};
$('#songList').onclick=e=>{const b=e.target.closest('button[data-act]');if(!b)return;const i=Number(b.dataset.i),a=b.dataset.act;if(a==='play'){current=i;transpose=0;setView('cifra');scrollTo(0,0);render()}if(a==='edit')editSong(i);if(a==='del'&&confirm(`Excluir “${songs[i].title}”?`)){songs.splice(i,1);current=Math.min(current,Math.max(0,songs.length-1));save('ws_songs',songs);render()}if(a==='up'&&i>0){[songs[i-1],songs[i]]=[songs[i],songs[i-1]];save('ws_songs',songs);render()}if(a==='down'&&i<songs.length-1){[songs[i+1],songs[i]]=[songs[i],songs[i+1]];save('ws_songs',songs);render()}};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),songs},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='worship-stage-backup.json';a.click();URL.revokeObjectURL(a.href)};$('#importBtn').onclick=()=>$('#fileInput').click();$('#fileInput').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(data)?data:data.songs;if(!Array.isArray(arr))throw Error();songs=arr.filter(x=>x&&x.title).map(x=>({id:x.id||crypto.randomUUID(),title:String(x.title),artist:String(x.artist||''),key:String(x.key||'C'),bpm:Number(x.bpm)||72,meter:String(x.meter||'4/4'),style:String(x.style||''),direction:String(x.direction||''),chart:String(x.chart||''),bass:String(x.bass||''),director:String(x.director||'')}));current=0;save('ws_songs',songs);render();$('#libraryStatus').textContent=`Importação concluída: ${songs.length} música(s).`}catch{$('#libraryStatus').textContent='Arquivo inválido. Use um backup JSON exportado pelo app.'}e.target.value=''};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')$('#nextBtn').click();if(e.key==='ArrowLeft')$('#prevBtn').click();if(e.key===' '){e.preventDefault();toggleScroll()}if(e.key==='m')toggleMetro();if(e.key==='+')$('#upBtn').click();if(e.key==='-')$('#downBtn').click()});document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&wakeLock){try{wakeLock=await navigator.wakeLock.request('screen')}catch{}}});render();setView('cifra');
})();
</script>
</body></html>
