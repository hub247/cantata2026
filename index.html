<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worship Stage — Setlist & Cifras</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --bg-card-hover: #2a2a2a;
            --text-main: #e5e7eb;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-pink: #f43f5e;
            --accent-amber: #f59e0b;
            --accent-amber-bg: rgba(245, 158, 11, 0.15);
            --border-color: #27272a;
            --chord-color: #60a5fa;
            --section-color: #fb7185;
            --success: #10b981;
            --danger: #ef4444;
        }

        .high-contrast {
            --bg-main: #000000;
            --bg-card: #0a0a0a;
            --bg-card-hover: #1a1a1a;
            --text-main: #ffffff;
            --text-muted: #e5e7eb;
            --accent-blue: #60a5fa;
            --chord-color: #93c5fd;
            --section-color: #fda4af;
            --border-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        button, select, input, textarea {
            font: inherit;
            color: inherit;
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background-color: var(--bg-card-hover); }
        button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }

        /* Layout Principal */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media(min-width: 768px) {
            .header-content {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .song-info h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .song-info p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn-primary {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
            color: #fff;
            font-weight: 600;
        }
        .btn-primary:hover { background-color: var(--accent-blue-hover); }

        .btn-icon {
            padding: 8px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        /* Faixa de Direção */
        #direction-banner {
            background-color: var(--accent-amber-bg);
            border-bottom: 1px solid rgba(245, 158, 11, 0.3);
            color: #fcd34d;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Main Workspace */
        main {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Área de Cifra / Baixo / Direção */
        .stage-view-container {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            flex: 1;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2);
            position: relative;
        }

        .chord-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.1rem;
            line-height: 1.8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .chord {
            color: var(--chord-color);
            font-weight: bold;
        }

        .section-title {
            color: var(--section-color);
            font-weight: bold;
            margin-top: 1.5rem;
            margin-bottom: 0.5rem;
            display: block;
            font-size: 1.15rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        /* Rodapé / Setlist Nav */
        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 12px 16px;
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        /* Modais & Painéis */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-body {
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-footer {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* Utilidades Visuais */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--accent-blue);
        }

        .metronome-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--text-muted);
            display: inline-block;
            transition: background-color 0.1s;
        }
        .metronome-indicator.beat {
            background-color: var(--accent-blue);
            box-shadow: 0 0 8px var(--accent-blue);
        }
        .metronome-indicator.beat-accent {
            background-color: var(--accent-pink);
            box-shadow: 0 0 12px var(--accent-pink);
        }

        .locked-mode pointer-events: none !important;

        /* Utilitário para esconder */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- CABEÇALHO DO PALCO -->
    <header id="stage-header">
        <div class="header-content">
            <div class="song-info">
                <h1 id="header-title">Carregando repertório...</h1>
                <p id="header-meta">Tom: - | BPM: - | Próxima: -</p>
            </div>

            <div class="controls-bar" role="toolbar" aria-label="Controles principais de palco">
                <!-- Metrônomo -->
                <button onclick="toggleMetronome()" id="btn-metronome" class="btn-icon" aria-label="Ligar ou desligar metrônomo">
                    <span id="metronome-dot" class="metronome-indicator"></span>
                    <span id="metronome-label">Metrônomo</span>
                </button>

                <!-- Controles de Transposição -->
                <div style="display: flex; align-items: center; gap: 4px;" aria-label="Controles de transposição">
                    <button onclick="transpose(-1)" aria-label="Baixar um semitom">-</button>
                    <span id="display-key" style="font-weight: bold; min-width: 30px; text-align: center;">C</span>
                    <button onclick="transpose(1)" aria-label="Subir um semitom">+</button>
                </div>

                <!-- Modos de Visualização de Conteúdo -->
                <select id="select-view-mode" onchange="changeViewMode(this.value)" aria-label="Modo de exibição">
                    <option value="chord">Modo Cifra</option>
                    <option value="bass">Modo Baixo</option>
                    <option value="direction">Modo Direção</option>
                </select>

                <!-- Modos de Navegação -->
                <select id="select-nav-mode" onchange="changeNavMode(this.value)" aria-label="Modo de navegação">
                    <option value="scroll">Rolagem Contínua</option>
                    <option value="pages">Modo Páginas</option>
                </select>

                <!-- Botões de Ação Geral -->
                <button onclick="openLibraryModal()" class="btn-icon">Biblioteca</button>
                <button onclick="toggleStageMode()" id="btn-stage-mode" class="btn-icon">Modo Palco</button>
                <button onclick="toggleLock()" id="btn-lock" class="btn-icon" aria-label="Travar controles">🔒 Travar</button>
            </div>
        </div>
    </header>

    <!-- FAIXA DE DIREÇÃO MUSICAL -->
    <div id="direction-banner" role="region" aria-label="Instruções de direção musical">
        <span>📢 Direção:</span> <span id="banner-note">Aguardando início do culto...</span>
    </div>

    <!-- ÁREA PRINCIPAL DA CIFRA / CONTEÚDO -->
    <main>
        <!-- Sub-barra de Rolagem / Páginas / BPM Rápido -->
        <div style="display: flex; justify-content: space-between; align-items: center; background: var(--bg-card); padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border-color); font-size: 0.85rem;">
            <div style="display: flex; gap: 8px; align-items: center;">
                <span>BPM:</span>
                <button onclick="adjustBpm(-4)">-4</button>
                <button onclick="adjustBpm(-1)">-1</button>
                <strong id="display-bpm">72</strong>
                <button onclick="adjustBpm(1)">+1</button>
                <button onclick="adjustBpm(4)">+4</button>
                <button onclick="saveTempBpm()" class="badge" style="cursor:pointer; border:none;">Salvar BPM</button>
            </div>

            <div id="scroll-page-controls" style="display: flex; gap: 8px; align-items: center;">
                <button onclick="toggleAutoPlay()" id="btn-autoplay" class="btn-primary">▶ Iniciar Auto</button>
                <span id="page-indicator" class="hidden">Página 1/1</span>
            </div>
        </div>

        <!-- Container visualizador -->
        <div class="stage-view-container">
            <div id="content-display" class="chord-text" tabindex="0" aria-live="polite">
                Carregando cifras...
            </div>
        </div>
    </main>

    <!-- RODAPÉ DE SETLIST -->
    <footer>
        <div class="footer-content">
            <button onclick="prevSong()" class="btn-icon">◀ Anterior</button>
            <div id="footer-setlist-info" style="font-size: 0.9rem; text-align: center; color: var(--text-muted);">
                Música 1 de 6 — Próxima: Nenhuma
            </div>
            <button onclick="nextSong()" class="btn-icon btn-primary">Próxima ▶</button>
        </div>
    </footer>

    <!-- MODAL DE BIBLIOTECA / SETLIST -->
    <div id="library-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="lib-title">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="lib-title" style="font-size: 1.1rem;">Biblioteca e Setlist</h2>
                <button onclick="closeLibraryModal()">✕</button>
            </div>
            <div class="modal-body">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="lib-search" placeholder="Buscar música ou artista..." oninput="renderLibraryList()" style="flex: 1;">
                    <button onclick="openEditorModal(null)" class="btn-primary">+ Nova Música</button>
                    <button onclick="exportData()">Exportar JSON</button>
                    <label class="btn-icon" style="cursor: pointer; display: inline-flex; align-items: center;">
                        Importar JSON <input type="file" id="import-file" accept=".json" onchange="importData(event)" class="hidden">
                    </label>
                </div>
                <div id="library-list" style="display: flex; flex-direction: column; gap: 8px; max-height: 400px; overflow-y: auto;">
                    <!-- Preenchido via JS -->
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeLibraryModal()" class="btn-primary">Fechar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE EDITOR DE MÚSICA -->
    <div id="editor-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="editor-title">
        <div class="modal-card" style="max-width: 800px;">
            <div class="modal-header">
                <h2 id="editor-title" style="font-size: 1.1rem;">Editor de Música</h2>
                <button onclick="closeEditorModal()">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="edit-id">
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px;">
                    <div>
                        <label style="font-size:0.8rem; display:block;">Título</label>
                        <input type="text" id="edit-title" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size:0.8rem; display:block;">Artista</label>
                        <input type="text" id="edit-artist" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size:0.8rem; display:block;">Tom Original</label>
                        <input type="text" id="edit-key" style="width: 100%;">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <div>
                        <label style="font-size:0.8rem; display:block;">BPM</label>
                        <input type="number" id="edit-bpm" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size:0.8rem; display:block;">Compasso</label>
                        <input type="text" id="edit-meter" style="width: 100%;">
                    </div>
                    <div>
                        <label style="font-size:0.8rem; display:block;">Estilo</label>
                        <input type="text" id="edit-style" style="width: 100%;">
                    </div>
                </div>
                <div>
                    <label style="font-size:0.8rem; display:block;">Nota Geral de Direção</label>
                    <input type="text" id="edit-note" style="width: 100%;">
                </div>
                <div>
                    <label style="font-size:0.8rem; display:block;">Cifra Completa</label>
                    <textarea id="edit-chart" rows="6" style="width: 100%; font-family: monospace;"></textarea>
                </div>
                <div>
                    <label style="font-size:0.8rem; display:block;">Visualização para Baixo</label>
                    <textarea id="edit-bass" rows="4" style="width: 100%; font-family: monospace;"></textarea>
                </div>
                <div>
                    <label style="font-size:0.8rem; display:block;">Roteiro de Direção</label>
                    <textarea id="edit-dir" rows="4" style="width: 100%; font-family: monospace;"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeEditorModal()">Cancelar</button>
                <button onclick="saveMusicFromEditor()" class="btn-primary">Salvar Música</button>
            </div>
        </div>
    </div>

            isLocked: false,
            isStageMode: false,
            isAutoPlaying: false,
            isMetronomeActive: false
        };

        let autoScrollInterval = null;
        let metronomeTimer = null;
        let audioCtx = null;

        // Inicialização
        function initApp() {
            loadFromLocalStorage();
            if (state.library.length === 0) {
                state.library = JSON.parse(JSON.stringify(initialPlaylist));
                state.setlist = state.library.map(m => m.id);
                saveToLocalStorage();
            }
            renderCurrentSong();
        }

        // Persistência LocalSegura
        function saveToLocalStorage() {
            try {
                localStorage.setItem('worship_stage_lib', JSON.stringify(state.library));
                localStorage.setItem('worship_stage_setlist', JSON.stringify(state.setlist));
                localStorage.setItem('worship_stage_index', state.currentIndex);
            } catch (e) {
                console.error("Erro ao salvar dados locais", e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const lib = localStorage.getItem('worship_stage_lib');
                const set = localStorage.getItem('worship_stage_setlist');
                const idx = localStorage.getItem('worship_stage_index');
                if (lib) state.library = JSON.parse(lib);
                if (set) state.setlist = JSON.parse(set);
                if (idx !== null) state.currentIndex = parseInt(idx, 10);
            } catch (e) {
                console.error("Erro ao carregar dados locais", e);
            }
        }

        // Renderização da Música Atual
        function getCurrentSong() {
            if (state.setlist.length === 0) return null;
            const songId = state.setlist[state.currentIndex];
            return state.library.find(m => m.id === songId) || state.library[0];
        }

        function renderCurrentSong() {
            const song = getCurrentSong();
            if (!song) {
                document.getElementById('header-title').innerText = "Nenhuma música no setlist";
                document.getElementById('header-meta').innerText = "";
                document.getElementById('content-display').innerHTML = "Adicione músicas pela Biblioteca.";
                return;
            }

            document.getElementById('header-title').innerText = song.title + " (" + song.artist + ")";
            const nextSongId = state.setlist[state.currentIndex + 1];
            const nextSong = state.library.find(m => m.id === nextSongId);
            const nextName = nextSong ? nextSong.title : "Fim do Setlist";

            state.tempBpm = song.bpm || 72;
            document.getElementById('display-bpm').innerText = state.tempBpm;
            document.getElementById('display-key').innerText = song.currentKey || song.originalKey;
            document.getElementById('header-meta').innerText = `Tom: ${song.currentKey || song.originalKey} | BPM: ${state.tempBpm} | Próxima: ${nextName}`;
            document.getElementById('banner-note').innerText = song.directionNote || "Sem observações específicas.";

            // Renderizar conteúdo de acordo com o modo
            let rawContent = "";
            if (state.viewMode === "bass") {
                rawContent = song.bassChart || song.chart;
            } else if (state.viewMode === "direction") {
                rawContent = song.directorChart || song.directionNote;
            } else {
                rawContent = song.chart;
            }

            document.getElementById('content-display').innerHTML = formatChartHtml(rawContent);
            document.getElementById('footer-setlist-info').innerText = `Música ${state.currentIndex + 1} de ${state.setlist.length} — Próxima: ${nextName}`;

            if (state.isMetronomeActive) {
                restartMetronome();
            }
        }

        function formatChartHtml(text) {
            if (!text) return "";
            const lines = text.split('\n');
            return lines.map(line => {
                let trimmed = line.trim();
                if (trimmed.startsWith('(') && trimmed.endsWith(')')) {
                    return `<span class="section-title">${escapeHtml(trimmed)}</span>`;
                }
                // Destacar acordes simples separados por espaço
                let escaped = escapeHtml(line);
                return escaped;
            }).join('\n');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // Navegação de Músicas
        function nextSong() {
            if (state.isLocked) return;
            if (state.currentIndex < state.setlist.length - 1) {
                state.currentIndex++;
                stopAutoPlay();
                renderCurrentSong();
                saveToLocalStorage();
            }
        }

        function prevSong() {
            if (state.isLocked) return;
            if (state.currentIndex > 0) {
                state.currentIndex--;
                stopAutoPlay();
                renderCurrentSong();
                saveToLocalStorage();
            }
        }

        // Modos e Preferências
        function changeViewMode(mode) {
            state.viewMode = mode;
            renderCurrentSong();
        }

        function changeNavMode(mode) {
            state.navMode = mode;
            const pageInd = document.getElementById('page-indicator');
            if (mode === 'pages') {
                pageInd.classList.remove('hidden');
            } else {
                pageInd.classList.add('hidden');
            }
        }

        // BPM e Metrônomo Baseado em Web Audio API / IntervaloPreciso
        function adjustBpm(amount) {
            if (state.isLocked) return;
            state.tempBpm = Math.max(30, Math.min(240, state.tempBpm + amount));
            document.getElementById('display-bpm').innerText = state.tempBpm;
            if (state.isMetronomeActive) restartMetronome();
        }

        function saveTempBpm() {
            const song = getCurrentSong();
            if (song) {
                song.bpm = state.tempBpm;
                saveToLocalStorage();
                alert("BPM salvo na música com sucesso!");
            }
        }

        function toggleMetronome() {
            state.isMetronomeActive = !state.isMetronomeActive;
            const btn = document.getElementById('btn-metronome');
            if (state.isMetronomeActive) {
                btn.style.borderColor = 'var(--accent-blue)';
                startMetronome();
            } else {
                btn.style.borderColor = 'var(--border-color)';
                stopMetronome();
            }
        }

        function startMetronome() {
            stopMetronome();
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let beatCount = 0;

            const intervalMs = (60000 / state.tempBpm);
            metronomeTimer = setInterval(() => {
                playClick(beatCount === 0);
                flashDot(beatCount === 0);
                beatCount = (beatCount + 4) % 4 === 0 ? 1 : beatCount + 1; // Simplificado 4/4
            }, intervalMs);
        }

        function stopMetronome() {
            if (metronomeTimer) clearInterval(metronomeTimer);
            metronomeTimer = null;
            const dot = document.getElementById('metronome-dot');
            dot.className = "metronome-indicator";
        }

        function restartMetronome() {
            startMetronome();
        }

        function playClick(isAccent) {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const envelope = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = isAccent ? 880 : 440;
                envelope.gain.setValueAtTime(1, audioCtx.currentTime);
                envelope.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.connect(envelope);
                envelope.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } catch(e) {}
        }

        function flashDot(isAccent) {
            const dot = document.getElementById('metronome-dot');
            dot.className = "metronome-indicator " + (isAccent ? "beat-accent" : "beat");
            setTimeout(() => {
                dot.className = "metronome-indicator";
            }, 100);
        }

        // Auto-Rolagem Musical Baseada em BPM e Altura
        function toggleAutoPlay() {
            state.isAutoPlaying = !state.isAutoPlaying;
            const btn = document.getElementById('btn-autoplay');
            if (state.isAutoPlaying) {
                btn.innerText = "⏸ Pausar Auto";
                startAutoScroll();
            } else {
                btn.innerText = "▶ Iniciar Auto";
                stopAutoPlay();
            }
        }

        function startAutoScroll() {
            stopAutoPlay();
            const container = document.querySelector('.stage-view-container');
            const song = getCurrentSong();
            const totalHeight = container.scrollHeight - container.clientHeight;
            if (totalHeight <= 0) return;

            // Estimativa de duração baseada em BPM (ex: 32 compassos de 4 tempos)
            const estimatedSeconds = (32 * 4 * 60) / (song.bpm || 72);
            const stepTime = 50; // ms
            const totalSteps = (estimatedSeconds * 1000) / stepTime;
            const scrollPerStep = totalHeight / totalSteps;

            autoScrollInterval = setInterval(() => {
                if (container.scrollTop + container.clientHeight >= container.scrollHeight) {
                    stopAutoPlay();
                    return;
                }
                container.scrollTop += scrollPerStep;
            }, stepTime);
        }

        function stopAutoPlay() {
            if (autoScrollInterval) clearInterval(autoScrollInterval);
            autoScrollInterval = null;
            state.isAutoPlaying = false;
            const btn = document.getElementById('btn-autoplay');
            if(btn) btn.innerText = "▶ Iniciar Auto";
        }

        // Transposição Simples de Semitons
        const scaleSharps = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const scaleFlats = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];

        function transpose(semitones) {
            if (state.isLocked) return;
            state.transposition += semitones;
            const song = getCurrentSong();
            if (!song) return;

            let baseKey = song.originalKey || "C";
            song.currentKey = shiftKey(baseKey, state.transposition);
            document.getElementById('display-key').innerText = song.currentKey;
            saveToLocalStorage();
        }

        function shiftKey(key, semitones) {
            let idx = scaleSharps.indexOf(key);
            if (idx === -1) idx = scaleFlats.indexOf(key);
            if (idx === -1) return key;
            let newIdx = (idx + semitones) % 12;
            if (newIdx < 0) newIdx += 12;
            return scaleSharps[newIdx];
        }

        // Modos Especiais (Palco / Bloqueio)
        function toggleStageMode() {
            state.isStageMode = !state.isStageMode;
            const header = document.getElementById('stage-header');
            const btn = document.getElementById('btn-stage-mode');
            if (state.isStageMode) {
                header.classList.add('hidden');
                btn.innerText = "Sair Palco";
                if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
            } else {
                header.classList.remove('hidden');
                btn.innerText = "Modo Palco";
                if (document.exitFullscreen && document.fullscreenElement) document.exitFullscreen().catch(() => {});
            }
        }

        function toggleLock() {
            state.isLocked = !state.isLocked;
            const btn = document.getElementById('btn-lock');
            if (state.isLocked) {
                btn.innerText = "🔓 Destravar";
                btn.style.backgroundColor = "var(--danger)";
            } else {
                btn.innerText = "🔒 Travar";
                btn.style.backgroundColor = "";
            }
        }

        // Biblioteca e Editor Modais
        function openLibraryModal() {
            renderLibraryList();
            document.getElementById('library-modal').classList.add('active');
        }

        function closeLibraryModal() {
            document.getElementById('library-modal').classList.remove('active');
        }

        function renderLibraryList() {
            const container = document.getElementById('library-list');
            const search = document.getElementById('lib-search').value.toLowerCase();
            container.innerHTML = "";

            state.library.forEach((song, idx) => {
                if (search && !song.title.toLowerCase().includes(search) && !song.artist.toLowerCase().includes(search)) return;

                const div = document.createElement('div');
                div.style.cssText = "display: flex; justify-content: space-between; align-items: center; background: var(--bg-main); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-color);";
                div.innerHTML = `
                    <div>
                        <strong>${escapeHtml(song.title)}</strong> <span style="color: var(--text-muted); font-size: 0.8rem;">(${escapeHtml(song.artist)})</span>
                    </div>
                    <div style="display: flex; gap: 4px;">
                        <button onclick="addToSetlist('${song.id}')">Adicionar</button>
                        <button onclick="openEditorModal('${song.id}')">Editar</button>
                        <button onclick="deleteMusic('${song.id}')" style="color: var(--danger);">Excluir</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addToSetlist(id) {
            state.setlist.push(id);
            saveToLocalStorage();
            alert("Música adicionada ao setlist!");
        }

        function deleteMusic(id) {
            if (confirm("Tem certeza que deseja excluir esta música da biblioteca?")) {
                state.library = state.library.filter(m => m.id !== id);
                state.setlist = state.setlist.filter(sId => sId !== id);
                saveToLocalStorage();
                renderLibraryList();
                renderCurrentSong();
            }
        }

        function openEditorModal(id) {
            const modal = document.getElementById('editor-modal');
            modal.classList.add('active');

            if (id) {
                const song = state.library.find(m => m.id === id);
                if (song) {
                    document.getElementById('edit-id').value = song.id;
                    document.getElementById('edit-title').value = song.title;
                    document.getElementById('edit-artist').value = song.artist;
                    document.getElementById('edit-key').value = song.originalKey;
                    document.getElementById('edit-bpm').value = song.bpm;
                    document.getElementById('edit-meter').value = song.meter;
                    document.getElementById('edit-style').value = song.style;
                    document.getElementById('edit-note').value = song.directionNote;
                    document.getElementById('edit-chart').value = song.chart;
                    document.getElementById('edit-bass').value = song.bassChart || "";
                    document.getElementById('edit-dir').value = song.directorChart || "";
                }
            } else {
                document.getElementById('edit-id').value = "";
                document.getElementById('edit-title').value = "";
                document.getElementById('edit-artist').value = "";
                document.getElementById('edit-key').value = "C";
                document.getElementById('edit-bpm').value = 72;
                document.getElementById('edit-meter').value = "4/4";
                document.getElementById('edit-style').value = "Adoração";
                document.getElementById('edit-note').value = "";
                document.getElementById('edit-chart').value = "";
                document.getElementById('edit-bass').value = "";
                document.getElementById('edit-dir').value = "";
            }
        }

        function closeEditorModal() {
            document.getElementById('editor-modal').classList.remove('active');
        }

        function saveMusicFromEditor() {
            const idInput = document.getElementById('edit-id').value;
            const title = document.getElementById('edit-title').value;
            if (!title) {
                alert("O título é obrigatório.");
                return;
            }

            const songData = {
                id: idInput || "song-" + Date.now(),
                title: title,
                artist: document.getElementById('edit-artist').value || "Desconhecido",
                originalKey: document.getElementById('edit-key').value || "C",
                currentKey: document.getElementById('edit-key').value || "C",
                transpose: 0,
                bpm: parseInt(document.getElementById('edit-bpm').value, 10) || 72,
                meter: document.getElementById('edit-meter').value || "4/4",
                style: document.getElementById('edit-style').value || "Geral",
                directionNote: document.getElementById('edit-note').value,
                chart: document.getElementById('edit-chart').value,
                bassChart: document.getElementById('edit-bass').value,
                directorChart: document.getElementById('edit-dir').value
            };

            if (idInput) {
                const idx = state.library.findIndex(m => m.id === idInput);
                if (idx !== -1) state.library[idx] = songData;
            } else {
                state.library.push(songData);
                state.setlist.push(songData.id);
            }

            saveToLocalStorage();
            closeEditorModal();
            renderLibraryList();
            renderCurrentSong();
            alert("Música salva com sucesso!");
        }

        // Importação e Exportação Segura via Blob
        function exportData() {
            const data = {
                version: "1.0",
                library: state.library,
                setlist: state.setlist
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `worship-stage-backup-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (parsed.library && Array.isArray(parsed.library)) {
                        state.library = parsed.library;
                        state.setlist = parsed.setlist || parsed.library.map(m => m.id);
                        state.currentIndex = 0;
                        saveToLocalStorage();
                        renderLibraryList();
                        renderCurrentSong();
                        alert("Backup importado com sucesso!");
                    } else {
                        alert("Arquivo JSON inválido.");
                    }
                } catch(err) {
                    alert("Erro ao ler o arquivo JSON.");
                }
            };
            reader.readAsText(file);
        }

        // Atalhos de Teclado Globais
        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;

            if (e.key === 'ArrowRight' || e.key === 'PageDown') {
                nextSong();
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                prevSong();
            } else if (e.key === ' ') {
                e.preventDefault();
                toggleAutoPlay();
            } else if (e.key.toLowerCase() === 'm') {
                toggleMetronome();
            } else if (e.key === '+') {
                transpose(1);
            } else if (e.key === '-') {
                transpose(-1);
            } else if (e.key.toLowerCase() === 'f') {
                toggleStageMode();
            } else if (e.key.toLowerCase() === 'l') {
                toggleLock();
            }
        });

        // Inicializar ao carregar o DOM
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
</html>
