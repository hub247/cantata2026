<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>Setlist & Cifras - Culto</title>
    <!-- Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        cardbg: '#1e1e1e',
                        accent: '#3b82f6'
                    }
                }
            }
        }
    </script>
    <style>
        .chord { color: #60a5fa; font-weight: bold; }
        .section-title { color: #f43f5e; font-weight: bold; margin-top: 1rem; display: block; }
        body { background-color: #121212; color: #e5e7eb; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between select-none">

    <!-- CABEÇALHO / DIREÇÃO MUSICAL -->
    <header class="bg-cardbg border-b border-zinc-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
            <div>
                <h1 id="song-title" class="text-xl font-bold text-white text-center md:text-left">Carregando repertório...</h1>
                <p id="song-meta" class="text-xs text-zinc-400 text-center md:text-left">Tom: C | BPM: 72</p>
            </div>

            <!-- CONTROLES DE PALCO -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <!-- Metrônomo / BPM -->
                <button onclick="toggleMetronome()" id="btn-metronome" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-2 rounded-lg font-medium flex items-center gap-1 border border-zinc-700 transition">
                    <span id="metronome-dot" class="w-2 h-2 rounded-full bg-zinc-500"></span>
                    <span id="metronome-text">Metrônomo (Off)</span>
                </button>

                <!-- Auto-rolagem -->
                <button onclick="toggleAutoScroll()" id="btn-scroll" class="bg-zinc-800 hover:bg-zinc-700 text-xs px-3 py-2 rounded-lg font-medium border border-zinc-700 transition">
                    ▶ Auto-Rolagem
                </button>

                <!-- Velocidade da rolagem -->
                <select id="scroll-speed" onchange="changeScrollSpeed()" class="bg-zinc-800 text-xs px-2 py-2 rounded-lg border border-zinc-700 text-white outline-none">
                    <option value="1">Velocidade 1x</option>
                    <option value="2" selected>Velocidade 2x</option>
                    <option value="3">Velocidade 3x</option>
                    <option value="4">Velocidade 4x</option>
                </select>
            </div>
        </div>
    </header>

    <!-- NOTAS DO LÍDER / DIREÇÃO MUSICAL -->
    <div id="leader-notes-container" class="bg-amber-950/40 border-b border-amber-900/50 px-4 py-2 text-xs text-amber-200 text-center">
        <strong>Nota de Direção:</strong> <span id="leader-note">Atenção na dinâmica da introdução.</span>
    </div>

    <!-- CORPO DA CIFRA -->
    <main class="flex-1 max-w-3xl w-full mx-auto p-4 md:p-6">
        <div id="chord-display" class="font-mono text-sm md:text-base leading-relaxed whitespace-pre-wrap bg-zinc-900/80 p-6 rounded-xl border border-zinc-800 shadow-inner">
            <!-- A cifra vai injetada aqui via JavaScript -->
        </div>
    </main>

    <!-- RODAPÉ / SETLIST (NAVEGAÇÃO ENTRE MÚSICAS) -->
    <footer class="bg-cardbg border-t border-zinc-800 p-4 sticky bottom-0 z-50">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-2">
            <button onclick="prevSong()" class="bg-zinc-800 hover:bg-zinc-700 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1">
                ◀ Anterior
            </button>
            <div id="setlist-indicator" class="text-xs font-semibold text-zinc-400">
                Música 1 de 6
            </div>
            <button onclick="nextSong()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-xs font-bold transition flex items-center gap-1">
                Próxima ▶
            </button>
        </div>
    </footer>

        let currentIndex = 0;
        let isScrolling = false;
        let scrollInterval = null;
        let isMetronomeActive = false;
        let metronomeInterval = null;

        // CARREGAR MÚSCUA NA TELA
        function loadSong(index) {
            if (index < 0 || index >= playlist.length) return;
            currentIndex = index;
            const song = playlist[currentIndex];

            document.getElementById('song-title').innerText = song.title;
            document.getElementById('song-meta').innerText = song.meta;
            document.getElementById('leader-note').innerText = song.note;
            document.getElementById('chord-display').innerHTML = song.content;
            document.getElementById('setlist-indicator').innerText = `Música ${currentIndex + 1} de ${playlist.length}`;

            // Reseta o scroll ao trocar de música
            window.scrollTo({ top: 0, behavior: 'smooth' });
            if (isScrolling) toggleAutoScroll(); // Para o scroll ao trocar
        }

        function nextSong() {
            if (currentIndex < playlist.length - 1) {
                loadSong(currentIndex + 1);
            }
        }

        function prevSong() {
            if (currentIndex > 0) {
                loadSong(currentIndex - 1);
            }
        }

        // AUTO-ROLAGEM INTELIGENTE
        function toggleAutoScroll() {
            const btn = document.getElementById('btn-scroll');
            isScrolling = !isScrolling;

            if (isScrolling) {
                btn.classList.add('bg-blue-600', 'border-blue-500');
                btn.innerText = '⏸ Pausar Rolagem';
                let speedMultiplier = parseInt(document.getElementById('scroll-speed').value) || 2;
                
                scrollInterval = setInterval(() => {
                    window.scrollBy(0, speedMultiplier);
                    // Se chegou ao fim da página, para automaticamente
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 10) {
                        toggleAutoScroll();
                    }
                }, 50);
            } else {
                btn.classList.remove('bg-blue-600', 'border-blue-500');
                btn.innerText = '▶ Auto-Rolagem';
                clearInterval(scrollInterval);
            }
        }

        function changeScrollSpeed() {
            if (isScrolling) {
                clearInterval(scrollInterval);
                let speedMultiplier = parseInt(document.getElementById('scroll-speed').value) || 2;
                scrollInterval = setInterval(() => {
                    window.scrollBy(0, speedMultiplier);
                }, 50);
            }
        }

        // METRÔNOMO VISUAL SILENCIOSO
        function toggleMetronome() {
            const btn = document.getElementById('btn-metronome');
            const dot = document.getElementById('metronome-dot');
            const text = document.getElementById('metronome-text');
            isMetronomeActive = !isMetronomeActive;

            if (isMetronomeActive) {
                btn.classList.add('border-blue-500', 'bg-zinc-800');
                text.innerText = 'Metrônomo (On)';
                // Pisca a cada 800ms (~75 BPM)
                metronomeInterval = setInterval(() => {
                    dot.classList.toggle('bg-blue-500');
                    dot.classList.toggle('bg-zinc-500');
                }, 800);
            } else {
                btn.classList.remove('border-blue-500');
                text.innerText = 'Metrônomo (Off)';
                dot.classList.remove('bg-blue-500');
                dot.classList.add('bg-zinc-500');
                clearInterval(metronomeInterval);
            }
        }

        // Inicializa a primeira música ao carregar a página
        window.onload = () => {
            loadSong(0);
        };
    </script>
