order-radius:13px;padding:0 14px;margin-bottom:12px}.fab{position:fixed;right:18px;bottom:calc(88px + var(--safe-bottom));width:58px;height:58px;border-radius:20px;border:1px solid #60a5fa;background:#2563eb;color:white;font-size:28px;z-index:18}.sheet-backdrop{position:fixed;inset:0;background:#0009;z-index:40;display:none}.sheet-backdrop.open{display:block}.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88svh;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:12px 14px calc(18px + var(--safe-bottom));transform:translateY(0)}.grab{width:44px;height:5px;border-radius:99px;background:#3b4250;margin:0 auto 13px}.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.sheet-head h2{margin:0;font-size:1.2rem}.tool-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.sheet-action{text-align:left;min-height:56px}.sheet-action small{display:block;color:var(--muted);margin-top:2px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0c1017;color:var(--text);border-radius:12px;padding:12px;min-height:50px}.field textarea{min-height:160px;resize:vertical}.edit-sections{display:grid;gap:10px}.section-editor{border:1px solid var(--line);border-radius:13px;padding:11px;background:#0d1118}.two{display:grid;grid-template-columns:1fr 110px;gap:8px}.toast{position:fixed;z-index:80;left:50%;bottom:calc(150px + var(--safe-bottom));transform:translateX(-50%);max-width:calc(100% - 28px);background:#202632;border:1px solid #4b5563;border-radius:12px;padding:10px 14px;display:none;text-align:center}.lock-banner{position:fixed;z-index:30;top:calc(8px + var(--safe-top));left:50%;transform:translateX(-50%);background:#7f1d1d;border:1px solid #fb7185;border-radius:999px;padding:6px 12px;font-size:12px;display:none}.locked .l </div>

<script>
(()=>{'use strict';

const seed=[
{id:'santo-pra-sempre',title:'Santo Pra Sempre',artist:'Gabriel Guedes',key:'C',bpm:72,meter:'4/4',style:'Adoração',note:'Manter o groove constante no baixo. Crescer a partir do segundo refrão.',sections:[S('Intro',8,'F9  Am7  G | Em7  Am7  G','F9 | Am7 | G | Em7 Am7 G','PAD + guitarra'),S('Verso 1',16,'C | Am7  G  F9 | C | Am7  G  F9','C | C | Am7 G | F9','BAIXO CONTIDO'),S('Pré-Refrão',16,'F9  Am7 | G | Am7  F9 | F9  Am7 | G | Am7  Dm7','F9 | Am7 | G | G | Am7 | F9 | Dm7 | G','CRESCE'),S('Refrão',16,'F9  Am7  G | Em7  Am7 | Dm7  G | C','F9 | Am7 | G | Em7 | Am7 | Dm7 G | C','BANDA')],route:[0,1,2,3]},

{id:'ele-e-exaltado',title:'Ele é Exaltado',artist:'Adhemar de Campos',key:'G',bpm:80,meter:'4/4',style:'Clássico congregacional',note:'Ritmo alegre e marcado. Atenção à passagem de acordes do refrão.',sections:[S('Intro',8,'G  G/B  C9  D/F#','G | G/B | C9 | D/F#','CONTAGEM 4'),S('Verso',16,'G | G/B  C9 | C/E  D/F# | G | G/B | C  D  C/E  D/F#','G | G/B | C | D','MARCADO'),S('Refrão',24,'Am7  Am7/G  D | G  G/B  C  G/B | Am7  Am7/G  D/F#  C/E  D | G  G/F  E4  E7 | Am7  Am/G | F  D  G','Am7 | D | G | C | Am7 | D | G','BANDA')],route:[0,1,2]},

{id:'jesus-rei-gloria',title:'Jesus é o Rei da Glória',artist:'Daniel Souza',key:'G',bpm:84,meter:'4/4',style:'Celebração com modulação',note:'Atenção à modulação: o refrão final sobe para A maior.',sections:[S('Intro',8,'G  C  D  G','G | C | D | G','CONTAGEM'),S('Verso — G',16,'G  C | D  G | G  C | D  G','G | C | D | G','MARCADO'),S('Refrão — G',16,'G  C | D  G | G  C | D  G','G | C | D | G','BANDA'),S('Modulação',4,'A','A','MODULA PARA A'),S('Refrão Final — A',16,'A  D | E  A | A  D | E  A','A | D | E | A','FORTE')],route:[0,1,2,3,4]}
];
function S(name,bars,chart,bass,direction){return{id:Math.random().toString(36).slice(2),name,bars,chart,bass,direction}}
const defaults={screen:'stage',contentMode:'chart',navMode:'pages',flow:'guided',font:18,lineHeight:1.72,transpose:0,currentSong:0,currentStep:0,immersive:false,tapZones:false,wake:false,locked:false};
let state=load('ws_state',defaults),songs=load('ws_songs_v3',null),setlist=load('ws_setlist_v3',null),prepared=null,playing=false,raf=0,startedAt=0,elapsed=0,metroTimer=0,beat=0,wakeLock=null,holdTimer=0;
if(!songs){songs=seed;save('ws_songs_v3',songs)}if(!setlist){setlist=songs.map(s=>s.id);save('ws_setlist_v3',setlist)}state={...defaults,...state};
function load(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return f}}function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}}function persist(){save('ws_state',state);save('ws_songs_v3',songs);save('ws_setlist_v3',setlist)}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2300)}
function orderedSongs(){return setlist.map(id=>songs.find(s=>s.id===id)).filter(Boolean)}function currentSong(){const o=orderedSongs();state.currentSong=Math.max(0,Math.min(state.currentSong,Math.max(0,o.length-1)));return o[state.currentSong]||null}function routeOf(s){return s?(s.route?.length?s.route:s.sections.map((_,i)=>i)):[]}function currentSection(){const s=currentSong();if(!s)return null;const r=routeOf(s);state.currentStep=Math.max(0,Math.min(state.currentStep,Math.max(0,r.length-1)));return s.sections[r[state.currentStep]]||null}
function chord(c,n){if(!n)return c;return c.replace(/(^|\/)([A-G])([#b]?)/g,(m,sl,l,a)=>{let i=sharp.indexOf(l+a);if(i<0)i=flat.indexOf(l+a);if(i<0)return m;const useFlat=a==='b'||['F','Bb','Eb','Ab','Db','Gb'].includes(currentSong()?.key);return sl+(useFlat?flat:sharp)[(i+n+120)%12]})}function formatLine(text){const rx=/(^|\s|\|)([A-G](?:#|b)?(?:m|maj|min|dim|aug|sus|add)?\d*(?:\([^)]*\))?(?:\/[A-G](?:#|b)?)?)(?=\s|\||$)/g;return esc(text).replace(rx,(m,p,c)=>p+`<span class="chord">${esc(chord(c,state.transpose))}</span>`)}
function sectionDuration(sec,s){const beats=parseInt(s?.meter)||4;return Math.max(1,(Number(sec?.bars)||8)*beats*60/Math.max(30,Math.min(240,Number(s?.bpm)||72)))}
function render(){document.documentElement.style.setProperty('--fs',state.font+'px');document.documentElement.style.setProperty('--lh',state.lineHeight);$('#app').classList.toggle('locked',state.locked);document.body.classList.toggle('immersive',state.immersive);renderStage();renderSetlist();renderLibrary();showScreen(state.screen,false)}
function renderStage(){const s=currentSong(),sec=currentSection(),o=orderedSongs();if(!s){$('#songTitle').textContent='Setlist vazio';$('#reader').innerHTML='<div class="empty">Adicione músicas ao setlist.</div>';return}const r=routeOf(s),nextSec=s.sections[r[state.currentStep+1]],nextSong=o[state.currentSong+1];$('#songPosition').textContent=`MÚSICA ${state.currentSong+1} DE ${o.length}`;$('#songTitle').textContent=s.title;$('#artist').textContent=s.artist||'Sem artista';$('#keyBadge').textContent=`TOM ${chord(s.key,state.transpose)}`;$('#bpmBadge').textContent=`${s.bpm} BPM`;$('#meterBadge').textContent=s.meter||'4/4';$('#navModeBadge').textContent=state.navMode==='pages'?'PÁGINAS':'ROLAGEM';$('#flowBadge').textContent=state.flow.toUpperCase();$('#directionNote span').textContent=s.note||'Sem nota geral.';$('#currentSection').textContent=sec?.name||'SEM SEÇÃO';$('#sectionPosition').textContent=`${state.currentStep+1} / ${r.length}`;$('#nextSection').textContent=nextSec?.name||'FIM';$('#sideNext').textContent=nextSec?.name||'FIM';$('#nextSong').textContent=nextSong?`${nextSong.title} • ${nextSong.key} • ${nextSong.bpm} BPM`:'Fim do setlist';$('#prepareBtn').disabled=!nextSong;$$('[data-content-mode]').forEach(b=>b.classList.toggle('active',b.dataset.contentMode===state.contentMode));let content='';if(sec){content=state.contentMode==='bass'?sec.bass:state.contentMode==='direction'?sec.direction:sec.chart}$('#reader').innerHTML=sec?`<span class="sec">${esc(sec.name)}</span>${content?formatLine(content):'<div class="empty">Sem conteúdo neste modo.</div>'}`:'<div class="empty">Sem seção cadastrada.</div>';if(state.contentMode==='direction'&&sec?.direction)$('#reader').innerHTML=`<span class="sec">${esc(sec.name)}</span><span class="cue">${esc(sec.direction)}</span>`;$('#playBtn').textContent=playing?'⏸':'▶';$('#progressFill').style.width=progressPct()+'%'}
function progressPct(){const s=currentSong(),sec=currentSection();if(!s||!sec)return 0;return Math.min(100,elapsed/sectionDuration(sec,s)*100)}
function showScreen(name,doSave=true){state.screen=name;$$('.screen').forEach(x=>x.classList.remove('active'));$('#'+name+'Screen').classList.add('active');$$('.nav-btn').forEach(x=>x.classList.toggle('active',x.dataset.screen===name));if(doSave)persist()}
function stop(){playing=false;cancelAnimationFrame(raf);renderStage()}function togglePlay(){if(!currentSection())return;if(playing){elapsed+=(performance.now()-startedAt)/1000;stop();return}playing=true;startedAt=performance.now();raf=requestAnimationFrame(tick);renderStage()}
function tick(now){if(!playing)return;const s=currentSong(),sec=currentSection(),dur=sectionDuration(sec,s),total=elapsed+(now-startedAt)/1000;$('#progressFill').style.width=Math.min(100,total/dur*100)+'%';if((state.flow==='auto')&&total>=dur){elapsed=0;startedAt=now;if(!nextStep())return}raf=requestAnimationFrame(tick)}
function nextStep(){const s=currentSong(),r=routeOf(s);if(state.currentStep<r.length-1){state.currentStep++;elapsed=0;renderStage();persist();return true}stop();openTransition();return false}function prevStep(){if(state.currentStep>0){state.currentStep--;elapsed=0;stop();renderStage();persist()}}function repeatStep(){elapsed=0;startedAt=performance.now();renderStage();toast('Seção reiniciada')}
function openTransition(){const o=orderedSongs(),next=o[state.currentSong+1];openSheet('Música concluída',`<div class="transition"><h2>FIM DA MÚSICA</h2>${next?`<div class="next-card"><small>PRÓXIMA</small><h3>${esc(next.title)}</h3><p>${esc(next.key)} • ${next.bpm} BPM</p></div><button class="sheet-action" data-cmd="prepare-next">Preparar próxima</button><button class="sheet-action" data-cmd="start-next">Iniciar próxima</button>`:'<div class="next-card"><h3>FIM DO SETLIST</h3></div>'}<button class="sheet-action" data-cmd="repeat">Repetir seção final</button></div>`)}
function prepareNext(){const o=orderedSongs();prepared=o[state.currentSong+1]||null;if(prepared)toast(`${prepared.title} preparada`)}function startNext(){const o=orderedSongs();if(state.currentSong<o.length-1){state.currentSong++;state.currentStep=0;state.transpose=0;elapsed=0;prepared=null;stop();closeSheet();showScreen('stage');render();window.scrollTo(0,0)}}
function startMetro(){stopMetro();const s=currentSong();if(!s)return;const bpm=Math.max(30,Math.min(240,Number(s.bpm)||72)),beats=parseInt(s.meter)||4;beat=0;const pulse=()=>{beat=(beat%beats)+1;$('#bpmBadge').classList.toggle('active',beat===1)};pulse();metroTimer=setInterval(pulse,60000/bpm);toast('Metrônomo visual ativado')}function stopMetro(){clearInterval(metroTimer);metroTimer=0;$('#bpmBadge').classList.remove('active')}
async function toggleWake(){try{if(wakeLock){await wakeLock.release();wakeLock=null;state.wake=false;toast('Tela ativa desativada')}else if('wakeLock'in navigator){wakeLock=await navigator.wakeLock.request('screen');state.wake=true;toast('Tela será mantida ativa')}else toast('Wake Lock não disponível')}catch{toast('Não foi possível manter a tela ativa')}persist()}
function openSheet(title,body){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=body;$('#sheetBackdrop').classList.add('open');$('#sheetBackdrop').setAttribute('aria-hidden','false')}function closeSheet(){$('#sheetBackdrop').classList.remove('open');$('#sheetBackdrop').setAttribute('aria-hidden','true')}
function toolsSheet(){const s=currentSong();openSheet('Ferramentas de palco',`<div class="tool-grid"><button class="sheet-action" data-cmd="repeat">↻ Repetir seção<small>Reinicia o progresso atual</small></button><button class="sheet-action" data-cmd="goto">⌁ Ir para…<small>Escolher uma seção</small></button><button class="sheet-action" data-cmd="toggle-nav">↕ ${state.navMode==='pages'?'Usar rolagem':'Usar páginas'}<small>Modo de leitura</small></button><button class="sheet-action" data-cmd="cycle-flow">◷ ${state.flow.toUpperCase()}<small>Manual, guiado ou automático</small></button><button class="sheet-action" data-cmd="metro">♪ Metrônomo<small>${metroTimer?'Desativar':'Ativar'} no BPM atual</small></button><button class="sheet-action" data-cmd="bpm">${s?.bpm||72} BPM<small>Ajuste rápido</small></button><button class="sheet-action" data-cmd="transpose">♯ Tom ${s?chord(s.key,state.transpose):'—'}<small>Transposição</small></button><button class="sheet-action" data-cmd="font">A± Texto<small>Tamanho e espaçamento</small></button><button class="sheet-action" data-cmd="wake">☀ Tela ativa<small>${state.wake?'Ligada':'Desligada'}</small></button><button class="sheet-action" data-cmd="immersive">⛶ Imersivo<small>Ocultar elementos secundários</small></button><button class="sheet-action" data-cmd="lock">🔒 ${state.locked?'Destravar':'Travar palco'}<small>${state.locked?'Pressione e segure':'Evitar toques acidentais'}</small></button><button class="sheet-action" data-cmd="fullscreen">□ Tela cheia<small>Quando disponível</small></button></div>`)}
function gotoSheet(){const s=currentSong(),r=routeOf(s);openSheet('Ir para seção',`<div class="cards">${r.map((idx,i)=>`<button class="sheet-action" data-goto="${i}">${i+1}. ${esc(s.sections[idx].name)}</button>`).join('')}</div>`)}function bpmSheet(){const s=currentSong();openSheet('Ajustar BPM',`<div class="tool-grid"><button class="sheet-action" data-bpm="-8">−8</button><button class="sheet-action" data-bpm="-4">−4</button><button class="sheet-action" disabled>${s.bpm} BPM</button><button class="sheet-action" data-bpm="4">+4</button><button class="sheet-action" data-bpm="8">+8</button></div><button class="sheet-action" data-cmd="metro" style="width:100%;margin-top:10px">${metroTimer?'Parar':'Iniciar'} metrônomo</button>`)}function transposeSheet(){const s=currentSong();openSheet('Transposição',`<div class="tool-grid"><button class="sheet-action" data-trans="-1">− Semitom</button><button class="sheet-action" disabled>${chord(s.key,state.transpose)}<small>${state.transpose>0?'+':''}${state.transpose} semitons</small></button><button class="sheet-action" data-trans="1">+ Semitom</button><button class="sheet-action" data-trans="reset">Restaurar original</button></div>`)}function fontSheet(){openSheet('Leitura',`<div class="tool-grid"><button class="sheet-action" data-font="-1">A−</button><button class="sheet-action" data-font="reset">A padrão</button><button class="sheet-action" data-font="1">A+</button><button class="sheet-action" data-line="-0.1">Menos espaço</button><button class="sheet-action" data-line="0.1">Mais espaço</button></div>`)}
function renderSetlist(){const o=orderedSongs();$('#setlistSummary').textContent=`${o.length} música(s) • atual ${o.length?state.currentSong+1:0}`;$('#setlistCards').innerHTML=o.length?o.map((s,i)=>`<article class="card"><div class="song-card"><div class="num">${String(i+1).padStart(2,'0')}</div><div><h3>${esc(s.title)}</h3><p>${esc(s.artist)} • ${s.key} • ${s.bpm} BPM</p></div><span class="status ${i===state.currentSong?'actual':i===state.currentSong+1?'ready':''}">${i===state.currentSong?'ATUAL':i===state.currentSong+1?'PRÓXIMA':'PRONTO'}</span></div><div class="row-actions"><button class="chip" data-set-open="${i}">Abrir</button><button class="chip" data-move="up" data-i="${i}">↑</button><button class="chip" data-move="down" data-i="${i}">↓</button><button class="chip" data-remove="${i}">Remover</button></div></article>`).join(''):'<div class="card">Setlist vazio. Adicione músicas pela Biblioteca.</div>'}
function renderLibrary(filter=''){const q=filter.toLowerCase().trim(),arr=songs.filter(s=>(s.title+' '+s.artist).toLowerCase().includes(q));$('#libraryCards').innerHTML=arr.length?arr.map(s=>`<article class="card"><div class="song-card"><div class="num">♫</div><div><h3>${esc(s.title)}</h3><p>${esc(s.artist)} • ${s.key} • ${s.bpm} BPM</p></div><span class="status">${setlist.includes(s.id)?'NO SETLIST':'BIBLIOTECA'}</span></div><div class="row-actions"><button class="chip" data-lib-add="${s.id}">${setlist.includes(s.id)?'Remover do setlist':'Adicionar ao setlist'}</button><button class="chip" data-lib-edit="${s.id}">Editar</button><button class="chip" data-lib-dup="${s.id}">Duplicar</button></div></article>`).join(''):'<div class="card">Nenhuma música encontrada.</div>'}
function libraryMenu(){openSheet('Biblioteca e backup',`<div class="tool-grid"><button class="sheet-action" data-cmd="export">Exportar backup<small>Músicas, setlist e ajustes</small></button><button class="sheet-action" data-cmd="import">Importar backup<small>Arquivo JSON validado</small></button></div>`)}function songEditor(id=null){const s=id?songs.find(x=>x.id===id):{id:crypto.randomUUID(),title:'',artist:'',key:'C',bpm:72,meter:'4/4',style:'',note:'',sections:[S('Intro',8,'','','')],route:[0]};openSheet(id?'Editar música':'Nova música',`<form id="songForm"><input type="hidden" name="id" value="${esc(s.id)}"><div class="field"><label>Título *</label><input name="title" required value="${esc(s.title)}"></div><div class="field"><label>Artista</label><input name="artist" value="${esc(s.artist)}"></div><div class="two"><div class="field"><label>Tom</label><input name="key" value="${esc(s.key)}"></div><div class="field"><label>BPM</label><input name="bpm" type="number" min="30" max="240" value="${s.bpm}"></div></div><div class="two"><div class="field"><label>Compasso</label><input name="meter" value="${esc(s.meter)}"></div><div class="field"><label>Estilo</label><input name="style" value="${esc(s.style||'')}"></div></div><div class="field"><label>Direção geral</label><textarea name="note">${esc(s.note||'')}</textarea></div><div class="edit-sections">${s.sections.map((x,i)=>sectionEditorHtml(x,i)).join('')}</div><button type="button" class="sheet-action" data-cmd="add-section">+ Adicionar seção</button><button type="submit" class="sheet-action" style="width:100%;margin-top:12px;background:#2563eb">Salvar música</button></form>`)}function sectionEditorHtml(x,i){return`<div class="section-editor" data-sec="${i}"><div class="two"><div class="field"><label>Seção</label><input name="sec_name_${i}" value="${esc(x.name)}"></div><div class="field"><label>Compassos</label><input name="sec_bars_${i}" type="number" min="1" max="256" value="${x.bars||8}"></div></div><div class="field"><label>Cifra / acordes</label><textarea name="sec_chart_${i}">${esc(x.chart||'')}</textarea></div><div class="field"><label>Modo Baixo</label><textarea name="sec_bass_${i}">${esc(x.bass||'')}</textarea></div><div class="field"><label>Direção</label><textarea name="sec_direction_${i}">${esc(x.direction||'')}</textarea></div></div>`}
function exportBackup(){const data={version:3,exportedAt:new Date().toISOString(),songs,setlist,state};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='worship-stage-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('Backup exportado')}async function importBackup(file){try{const d=JSON.parse(await file.text());if(d.version!==3||!Array.isArray(d.songs)||!Array.isArray(d.setlist)||!d.songs.every(x=>x.id&&x.title&&Array.isArray(x.sections)))throw Error();songs=d.songs;setlist=d.setlist.filter(id=>songs.some(s=>s.id===id));state={...defaults,...d.state,currentSong:0,currentStep:0};persist();render();toast(`${songs.length} música(s) importada(s)`)}catch{toast('Backup inválido. Nenhum dado foi substituído.')}}
$$('.nav-btn').forEach(b=>b.onclick=()=>showScreen(b.dataset.screen));$$('[data-content-mode]').forEach(b=>b.onclick=()=>{state.contentMode=b.dataset.contentMode;persist();renderStage()});$('#toolsBtn').onclick=toolsSheet;$('#sheetClose').onclick=closeSheet;$('#sheetBackdrop').onclick=e=>{if(e.target===$('#sheetBackdrop'))closeSheet()};$('#playBtn').onclick=togglePlay;$('#prevSectionBtn').onclick=prevStep;$('#nextSectionBtn').onclick=()=>{stop();nextStep()};$('#prepareBtn').onclick=prepareNext;$('#keyBadge').onclick=transposeSheet;$('#bpmBadge').onclick=bpmSheet;$('#navModeBadge').onclick=()=>{state.navMode=state.navMode==='pages'?'scroll':'pages';persist();renderStage()};$('#flowBadge').onclick=cycleFlow;$('#newSongBtn').onclick=()=>songEditor();$('#searchInput').oninput=e=>renderLibrary(e.target.value);$('#libraryMenuBtn').onclick=libraryMenu;$('#setlistMenuBtn').onclick=()=>openSheet('Setlist',`<button class="sheet-action" data-cmd="export">Exportar backup</button><button class="sheet-action" data-cmd="check">Checklist pré-culto</button>`);
function cycleFlow(){state.flow=state.flow==='manual'?'guided':state.flow==='guided'?'auto':'manual';persist();renderStage();toast(`Modo ${state.flow}`)}
$('#sheetBody').onclick=e=>{const b=e.target.closest('button');if(!b)return;const c=b.dataset.cmd;if(c==='repeat'){repeatStep();closeSheet()}if(c==='goto')gotoSheet();if(c==='toggle-nav'){state.navMode=state.navMode==='pages'?'scroll':'pages';persist();toolsSheet();renderStage()}if(c==='cycle-flow'){cycleFlow();toolsSheet()}if(c==='metro'){metroTimer?stopMetro():startMetro();toolsSheet()}if(c==='bpm')bpmSheet();if(c==='transpose')transposeSheet();if(c==='font')fontSheet();if(c==='wake'){toggleWake();toolsSheet()}if(c==='immersive'){state.immersive=!state.immersive;persist();render();closeSheet()}if(c==='lock'){if(!state.locked){state.locked=true;persist();render();closeSheet();toast('Palco travado. Segure o menu para destravar.')}}if(c==='fullscreen'){document.fullscreenElement?document.exitFullscreen?.():document.documentElement.requestFullscreen?.();closeSheet()}if(c==='prepare-next'){prepareNext();closeSheet()}if(c==='start-next')startNext();if(c==='export'){exportBackup();closeSheet()}if(c==='import'){$('#fileInput').click();closeSheet()}if(c==='check'){const incomplete=orderedSongs().filter(s=>!s.bpm||!s.key||!s.sections.length||s.sections.some(x=>!x.bars));openSheet('Checklist pré-culto',`<div class="card">${incomplete.length?`${incomplete.length} música(s) precisam de revisão.`:'Setlist pronto: tom, BPM, seções e compassos preenchidos.'}</div>`)}if(b.dataset.goto!==undefined){state.currentStep=Number(b.dataset.goto);elapsed=0;stop();persist();renderStage();closeSheet()}if(b.dataset.bpm){const s=currentSong();s.bpm=Math.max(30,Math.min(240,s.bpm+Number(b.dataset.bpm)));stopMetro();persist();bpmSheet();renderStage()}if(b.dataset.trans){state.transpose=b.dataset.trans==='reset'?0:state.transpose+Number(b.dataset.trans);persist();transposeSheet();renderStage()}if(b.dataset.font){state.font=b.dataset.font==='reset'?18:Math.max(13,Math.min(30,state.font+Number(b.dataset.font)));persist();fontSheet();render()}if(b.dataset.line){state.lineHeight=Math.max(1.2,Math.min(2.2,state.lineHeight+Number(b.dataset.line)));persist();fontSheet();render()}if(c==='add-section'){const form=$('#songForm'),count=form.querySelectorAll('.section-editor').length,div=document.createElement('div');div.innerHTML=sectionEditorHtml(S('Nova seção',8,'','',''),count);form.querySelector('.edit-sections').append(div.firstElementChild)}};
$('#toolsBtn').addEventListener('pointerdown',()=>{if(state.locked)holdTimer=setTimeout(()=>{state.locked=false;persist();render();toast('Palco destravado')},1000)});['pointerup','pointerleave','pointercancel'].forEach(ev=>$('#toolsBtn').addEventListener(ev,()=>clearTimeout(holdTimer)));
$('#setlistCards').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.setOpen!==undefined){state.currentSong=Number(b.dataset.setOpen);state.currentStep=0;elapsed=0;stop();persist();showScreen('stage');render()}if(b.dataset.move){const i=Number(b.dataset.i),j=b.dataset.move==='up'?i-1:i+1;if(j>=0&&j<setlist.length){[setlist[i],setlist[j]]=[setlist[j],setlist[i]];persist();render()}}if(b.dataset.remove!==undefined){const i=Number(b.dataset.remove);setlist.splice(i,1);state.currentSong=Math.min(state.currentSong,Math.max(0,setlist.length-1));persist();render()}};
$('#libraryCards').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.libAdd||b.dataset.libEdit||b.dataset.libDup;if(b.dataset.libAdd){if(setlist.includes(id))setlist=setlist.filter(x=>x!==id);else setlist.push(id);persist();render()}if(b.dataset.libEdit)songEditor(id);if(b.dataset.libDup){const s=songs.find(x=>x.id===id),copy=JSON.parse(JSON.stringify(s));copy.id=crypto.randomUUID();copy.title+=' (cópia)';songs.push(copy);persist();render();toast('Música duplicada')}};
$('#sheetBody').addEventListener('submit',e=>{if(e.target.id!=='songForm')return;e.preventDefault();const f=new FormData(e.target),id=f.get('id'),existing=songs.find(x=>x.id===id),sections=$$('.section-editor').map((el,i)=>({id:existing?.sections?.[i]?.id||crypto.randomUUID(),name:f.get(`sec_name_${i}`)||'Seção',bars:Math.max(1,Number(f.get(`sec_bars_${i}`))||8),chart:f.get(`sec_chart_${i}`)||'',bass:f.get(`sec_bass_${i}`)||'',direction:f.get(`sec_direction_${i}`)||''})),obj={id,title:String(f.get('title')).trim(),artist:String(f.get('artist')).trim(),key:String(f.get('key')).trim()||'C',bpm:Math.max(30,Math.min(240,Number(f.get('bpm'))||72)),meter:String(f.get('meter')).trim()||'4/4',style:String(f.get('style')).trim(),note:String(f.get('note')).trim(),sections,route:sections.map((_,i)=>i)};if(!obj.title)return toast('Informe o título');const i=songs.findIndex(x=>x.id===id);if(i>=0)songs[i]=obj;else songs.push(obj);persist();closeSheet();render();toast('Música salva')});
$('#fileInput').onchange=e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value=''};
let tx=0,ty=0;$('#readerArea').addEventListener('touchstart',e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});$('#readerArea').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.4){dx<0?nextStep():prevStep()}},{passive:true});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();nextStep()}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prevStep()}if(e.key===' '){e.preventDefault();togglePlay()}if(e.key.toLowerCase()==='m')metroTimer?stopMetro():startMetro();if(e.key==='+'){state.transpose++;renderStage()}if(e.key==='-'){state.transpose--;renderStage()}if(e.key.toLowerCase()==='r')repeatStep();if(e.key.toLowerCase()==='f'){state.immersive=!state.immersive;render()}if(e.key==='Escape')closeSheet()});document.addEventListener('visibilitychange',async()=>{if(document.visibilityState==='visible'&&state.wake&&'wakeLock'in navigator)try{wakeLock=await navigator.wakeLock.request('screen')}catch{}});
render();
})();
